services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${BADGERBOX_OTLP_GRPC_PORT:-34317}:4317"
      - "127.0.0.1:${BADGERBOX_OTLP_HTTP_PORT:-34318}:4318"
      - "127.0.0.1:${BADGERBOX_COLLECTOR_METRICS_PORT:-39464}:9464"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${BADGERBOX_PROMETHEUS_PORT:-39090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:${BADGERBOX_TEMPO_PORT:-33200}:3200"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${BADGERBOX_GRAFANA_PORT:-33000}:3000"
    depends_on:
      - prometheus
      - tempo
