name: CI

on:
  push:
  pull_request:

env:
  GOWORK: "off"

permissions:
  contents: read

jobs:
  fast:
    name: Fast build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/badgerbox-demo/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Lint
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1
          "$RUNNER_TEMP/bin/golangci-lint" run --build-tags=integration ./...
          (cd cmd/badgerbox-demo && "$RUNNER_TEMP/bin/golangci-lint" run --build-tags=integration ./...)

      - name: Build root module
        run: go build ./...

      - name: Test root module
        run: go test -race ./...

      - name: Build demo module
        working-directory: cmd/badgerbox-demo
        run: go build ./...

      - name: Test demo module
        working-directory: cmd/badgerbox-demo
        run: go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/badgerbox-demo/go.sum

      - name: Run integration tests
        run: go test -race -tags=integration ./...
